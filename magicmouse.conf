# /etc/magicmouse/magicmouse.conf - magicmoused settings
#
# Every line is commented out: the values shown are the built-in defaults.
# Uncomment only what you want to change; everything else keeps following
# the defaults, also after an update.
#
# Apply changes:   sudo systemctl reload magicmouse
# Check the file:  magicmoused -p

# ------------------------------------------------------------------
# Scrolling
# ------------------------------------------------------------------

# touchpad: one finger drives two fingers on a virtual touchpad. Pixel-
#           precise scrolling with inertia in every app, touch to stop,
#           horizontal swipe = back/forward in browsers. Direction follows
#           GNOME Settings > Mouse & Touchpad > Touchpad > Natural Scrolling.
# wheel:    high-resolution wheel (with inertia too). Fallback only.
# scroll_mode = touchpad

# Speed: 1.0 moves the content roughly 1:1 with the finger.
# scroll_speed = 1.0

# Extra distance for fast strokes: 0 = none, 1.0 = up to twice as far.
# scroll_accel = 1.0

# Finger travel (mm) before scrolling starts; twice that sideways. Scrolling
# never starts while the mouse is moving or a button is pressed.
# scroll_threshold_mm = 1.5

# Lock to the axis the stroke started on.
# axis_lock = 1

# Inertia after the finger leaves the surface while moving.
# 1: done by the driver - works in every app, repeated flicks build speed.
# 0: left to the apps (only GTK and Firefox have it).
# momentum = 1
# How long it coasts (ms, decay time constant).
# momentum_time_ms = 500

# wheel mode only:
# natural_scroll = 1

# ------------------------------------------------------------------
# Swipes
# ------------------------------------------------------------------

# One finger sideways (macOS: swipe between pages).
# scroll: sent as horizontal scrolling; Firefox, Chrome and GNOME apps
#         animate back/forward themselves.
# keys:   a quick sideways stroke presses back_keys / forward_keys
#         (no horizontal scrolling then).
# horizontal_swipe = scroll
# back_keys = ALT+LEFT
# forward_keys = ALT+RIGHT

# Two fingers sideways (macOS: swipe between full-screen apps).
# native: the GNOME three-finger touchpad gesture - workspaces follow the
#         fingers, a quick flick switches at once.
# keys:   workspace_left_keys / workspace_right_keys.
# off:    disabled.
# two_finger_swipe = native
# swipe_speed = 1.6
# workspace_left_keys = SUPER+PAGEUP
# workspace_right_keys = SUPER+PAGEDOWN

# Two fingers up/down: overview (GNOME overview, as with three fingers on a
# touchpad), scroll (plain scrolling) or off.
# two_finger_vertical = overview
# keys mode only:
# swipe_up_keys = SUPER
# swipe_down_keys = none

# ------------------------------------------------------------------
# Taps (a light touch without clicking)
# ------------------------------------------------------------------

# Action: smart-zoom, none, or a key combination such as SUPER or CTRL+ALT+T.
# one_finger_double_tap = smart-zoom
# two_finger_double_tap = SUPER

# Smart zoom: pinch = a virtual pinch (browsers, image and PDF viewers zoom
# around the pointer); keys = zoom_in_keys / zoom_out_keys.
# smart_zoom = pinch
# zoom_in_keys = CTRL+EQUAL
# zoom_out_keys = CTRL+0

# A tap is shorter than tap_time_ms and moves less than tap_move_mm; the
# second tap must start within double_tap_ms of the first.
# tap_time_ms = 350
# double_tap_ms = 450
# tap_move_mm = 3.0

# ------------------------------------------------------------------
# Clicks
# ------------------------------------------------------------------

# right: right click when every finger is on the right half (macOS rule).
# left:  for left-handed use.  off: always a left click.
# secondary_click = right

# Where the halves meet, as a fraction of the width.
# click_split = 0.5

# 1: clicking with two fingers (one on each half) is a middle click.
# middle_click = 0

# ------------------------------------------------------------------
# Surface (normally left alone)
# ------------------------------------------------------------------

# Touches that start at the side edges (gripping thumb) or at the back
# (palm) take no part in scrolling or gestures. Fractions of width/length.
# edge_zone = 0.05
# palm_zone = 0.12

# Flip an axis if scrolling or swiping goes the wrong way on one axis only.
# invert_x = 0
# invert_y = 0

# Sensor resolution. The surface is about 51.5 x 90.6 mm.
# units_per_mm_x = 45.77
# units_per_mm_y = 40.15

# 1: take the mouse over from the kernel driver. Without it the kernel's own
# coarse scrolling and middle-click zone keep running alongside.
# grab = 1

# Log touches, clicks and gestures (same as running with -v).
# verbose = 0
