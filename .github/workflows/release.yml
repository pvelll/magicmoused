name: Release

# Pushing a tag such as v1.0.0 runs the tests, builds the Debian/Ubuntu
# package for x86-64 (amd64) and publishes it as a GitHub release.
# An arm64 package is cross-built as an extra: if that build fails, the
# release is published without it.
# A tag with a dash (v1.1.0-rc1) becomes a pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run the tests
        run: make test

      - name: Build the amd64 package
        run: make deb VERSION="${GITHUB_REF_NAME#v}" DEB_ARCH=amd64

      - name: Check the amd64 package
        run: |
          dpkg-deb --info dist/*_amd64.deb
          dpkg-deb --contents dist/*_amd64.deb
          dpkg-deb -x dist/*_amd64.deb "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/usr/bin/magicmoused" -V
          "$RUNNER_TEMP/pkg/usr/bin/magicmoused" -p -c "$RUNNER_TEMP/pkg/etc/magicmouse/magicmouse.conf"

      - name: Install the arm64 cross compiler (optional)
        continue-on-error: true
        run: |
          sudo apt-get update
          # The arm64 libc headers are only a "Recommends" of the compiler.
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build the arm64 package (optional)
        continue-on-error: true
        run: |
          rm -f magicmoused magicmouse-dump
          make deb VERSION="${GITHUB_REF_NAME#v}" DEB_ARCH=arm64 CC=aarch64-linux-gnu-gcc

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          ls -l

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "magicmoused ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $flags
